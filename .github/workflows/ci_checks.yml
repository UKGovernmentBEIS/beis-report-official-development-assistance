name: CI Checks

on:
  push:

jobs:
  lint-and-format:
    name: Linting and formatting
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Build and cache
        uses: ./.github/workflows/build_and_cache
      -
        name: Run Standard Ruby
        run: |
          docker run --rm app_test:latest /bin/bash -c "bundle exec standardrb -f simple"
      -
        name: Run Shellcheck
        run: |
          for file in $(git ls-files script/*)
          do shellcheck -x "$file"
          done

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Build and cache
        uses: ./.github/workflows/build_and_cache
      -
        name: Run Brakeman
        run: |
          docker run --rm app_test:latest /bin/bash -c "bundle exec brakeman -o /dev/stdout"

  specs:
    name: Specs and coverage
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Build and cache
        uses: ./.github/workflows/build_and_cache
      -
        name: Run Rspec and Simplecov
        run: |
          docker compose -p app_test -f docker-compose.ci.yml \
            run --name app_test test /bin/bash -c "bin/rails spec"
      -
        name: Copy coverage report from container
        run: mkdir coverage && docker cp app_test:/app/coverage/lcov.info coverage/lcov.info
      -
        name: Shutdown containers
        run: docker compose -p app_test down && docker compose -p app_test rm
      -
        name: Send coverage report to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: ./coverage/lcov.info
          fail-on-error: false

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            RAILS_ENV=production
          push: false
          load: true
          tags: app_production:latest
          # Separate scope so this cache does not evict the test image's
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=min,scope=production
      -
        name: Boot the application
        run: |
          docker run --rm --entrypoint "" \
            -e DOMAIN=stand-in.local \
            -e SECRET_KEY_BASE=stand-in \
            -e DATABASE_URL=postgres://stand-in:5432/stand-in \
            -e REDIS_URL=redis://stand-in.local:6379 \
            app_production:latest \
            bundle exec rails runner "Rails.application.eager_load!"
